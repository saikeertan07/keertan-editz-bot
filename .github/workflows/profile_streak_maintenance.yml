name: System Maintenance & Continuous Telemetry Engine

on:
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telemetry-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute System Maintenance & Telemetry Engine
        run: |
          python3 scripts/automation/maintain_streak.py

      - name: Commit and Push Routine Maintenance Telemetry
        run: |
          git config user.name "Sai Keertan"
          git config user.email "tedlasaikeertan@gmail.com"
          if [[ -n $(git status --porcelain docs/logs/system_maintenance.log) ]]; then
            git add docs/logs/system_maintenance.log
            git commit -m "chore(telemetry): routine system maintenance and audit verification [skip ci]"
            git push origin main
          else
            echo "Today is scheduled quiet cycle. No telemetry updates to commit."
          fi
